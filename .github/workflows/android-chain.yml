# Builds libusque.so (android/arm64) WITH the `chain` subcommand, for the
# rethink-app-masque Chain mode UI. Pull requests only build it.
#
# Deploys do NOT come from here: every release ("Final workflow", a new
# version tag on main) publishes its own android/arm64 build into the app as
# libusque.so (job publish-app in release.yml). A manual run of this workflow
# is the escape hatch: it builds any ref and can commit it into the app.
#
# Publishing needs a repo secret APP_REPO_TOKEN: a PAT with Contents: read &
# write on <owner>/rethink-app-masque (GITHUB_TOKEN cannot push to another
# repo). The previous .so is kept as libusque.so.prev; libusque.so.bak is never
# touched.
name: Android chain .so

on:
  pull_request:
  workflow_dispatch:
    inputs:
      ref:
        description: Git ref to build (branch, tag or SHA)
        required: false
        default: main
      push_to_app:
        description: Commit the .so into rethink-app-masque jniLibs
        type: boolean
        default: true
      app_branch:
        description: rethink-app-masque branch to commit to
        required: false
        default: main

permissions:
  contents: read

concurrency:
  group: android-chain-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-android-arm64:
    name: Build libusque.so (android/arm64)
    runs-on: ubuntu-latest
    env:
      GOOS: android
      GOARCH: arm64
      CGO_ENABLED: "0"
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.ref || github.ref }}
          fetch-depth: 0   # tags, to name the version

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Sanity — chain subcommand present
        run: |
          test -f cmd/chain.go || { echo "::error::cmd/chain.go missing — wrong ref? The chain is on main since #6."; exit 1; }

      - name: Build libusque.so
        run: |
          set -eux
          mkdir -p out
          # -trimpath for reproducibility; -s -w to strip, matching the app's size budget.
          go build -trimpath -ldflags="-s -w" -o out/libusque.so .
          ls -la out/
          file out/libusque.so || true

      - name: Record build info
        id: info
        env:
          TRIGGER: ${{ github.event_name }}
        run: |
          SHA=$(git rev-parse HEAD)
          # The release tag on this commit, if any.
          TAG=$(git tag --points-at HEAD --sort=-v:refname | head -n1)
          echo "sha=$SHA" >> "$GITHUB_OUTPUT"
          echo "short=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          {
            echo "trigger: $TRIGGER"
            echo "tag: ${TAG:-none}"
            echo "sha: $SHA"
            echo "go:  $(go version)"
            echo "size: $(stat -c%s out/libusque.so) bytes"
            echo "sha256: $(sha256sum out/libusque.so | cut -d' ' -f1)"
          } | tee out/libusque.so.buildinfo.txt

      - name: Verify it is an arm64 ELF (not a host binary)
        run: |
          set -e
          hdr=$(od -An -tx1 -N20 out/libusque.so | tr -d ' \n')
          # ELF magic 7f454c46, class 2 (64-bit) at byte 4, machine 0x00b7 (AArch64) at bytes 18-19 (LE).
          case "$hdr" in
            7f454c46*) echo "ELF OK" ;;
            *) echo "::error::not an ELF binary"; exit 1 ;;
          esac
          # e_machine is at offset 18 (little-endian): expect b700
          mach=$(od -An -tx1 -j18 -N2 out/libusque.so | tr -d ' \n')
          test "$mach" = "b700" || { echo "::error::e_machine=$mach, expected b700 (AArch64)"; exit 1; }
          echo "AArch64 OK"

      - name: Upload libusque.so
        uses: actions/upload-artifact@v4
        with:
          name: libusque-android-arm64-${{ steps.info.outputs.sha }}
          path: |
            out/libusque.so
            out/libusque.so.buildinfo.txt
          retention-days: 30
          if-no-files-found: error

      - name: Publish to rethink-app-masque jniLibs
        if: github.event_name == 'workflow_dispatch' && inputs.push_to_app
        env:
          APP_TOKEN: ${{ secrets.APP_REPO_TOKEN }}
          # Same owner as this repo, so a fork publishes into its own app repo.
          APP_REPO: ${{ github.repository_owner }}/rethink-app-masque
          APP_BRANCH: ${{ inputs.app_branch || 'main' }}
          JNI_DIR: app/src/main/jniLibs/arm64-v8a
          SRC_SHA: ${{ steps.info.outputs.short }}
          SRC_TAG: ${{ steps.info.outputs.tag }}
        run: |
          set -eu
          if [ -z "$APP_TOKEN" ]; then
            echo "::error::Secret APP_REPO_TOKEN is not set. Add a PAT with Contents read/write on $APP_REPO under Settings -> Secrets and variables -> Actions."
            exit 1
          fi
          SRC="usque@${SRC_SHA}"
          if [ -n "$SRC_TAG" ]; then SRC="usque ${SRC_TAG} (${SRC_SHA})"; fi
          git clone --depth 1 --branch "$APP_BRANCH" "https://x-access-token:${APP_TOKEN}@github.com/${APP_REPO}.git" _app
          cd _app
          mkdir -p "$JNI_DIR"
          if [ -f "$JNI_DIR/libusque.so" ] && ! cmp -s "$JNI_DIR/libusque.so" ../out/libusque.so; then
            cp -f "$JNI_DIR/libusque.so" "$JNI_DIR/libusque.so.prev"
          fi
          cp -f ../out/libusque.so "$JNI_DIR/libusque.so"
          (cd "$JNI_DIR" && sha256sum libusque.so > libusque.so.working.sha256)
          git add "$JNI_DIR"
          if git diff --cached --quiet; then
            echo "::notice::libusque.so on $APP_REPO@$APP_BRANCH already matches $SRC, nothing to commit"
            exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git commit -m "chore(usque): libusque.so arm64 from ${SRC} (with chain subcommand)"
          # Always qualify the ref: the app repo also has a tag named "main".
          pushed=false
          for i in 1 2 3; do
            if git push origin "HEAD:refs/heads/${APP_BRANCH}"; then pushed=true; break; fi
            git pull --rebase origin "refs/heads/${APP_BRANCH}"
          done
          if [ "$pushed" != true ]; then
            echo "::error::Could not push libusque.so to $APP_REPO@$APP_BRANCH after 3 tries"
            exit 1
          fi
          git ls-remote origin "refs/heads/${APP_BRANCH}"
          echo "::notice::Published libusque.so from ${SRC} to ${APP_REPO}@${APP_BRANCH}/${JNI_DIR}"
