name: CI

on:
  push:                        # every commit to any branch
  pull_request:                # every PR (any base)
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lint-and-test:
    name: Lint and test
    runs-on: ubuntu-latest
    env:
      CGO_ENABLED: "0"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          # Newest 1.26 patch: stdlib security fixes ship in point releases. Not '>=1.26':
          # golangci-lint v2.11.4 is built with go1.26 and panics on a go1.27 toolchain
          # ("file requires newer Go version go1.27"). Move this with the linter version.
          go-version: '1.26.x'
          check-latest: true

      - name: Verify modules
        run: go mod verify

      - name: Build
        run: go build -trimpath ./...

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test ./...

      - name: golangci-lint
        uses: golangci/golangci-lint-action@v8
        with:
          version: v2.11.4
          args: --timeout=5m
