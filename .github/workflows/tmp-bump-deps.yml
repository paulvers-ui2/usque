# ONE-TIME helper: computes go.sum for the dependency bump on the runner
# (which can reach proxy.golang.org / sum.golang.org), verifies the build,
# commits go.mod + go.sum, and deletes this file in that same commit.
name: tmp bump deps (self-deleting)
on:
  push:
    branches: [security/pipeline]
permissions:
  contents: write
jobs:
  bump:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: security/pipeline
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: go.mod
          cache: false
      - name: Bump, tidy, verify, commit
        run: |
          set -uo pipefail
          # Each step reports its own failure as an annotation (readable via the API).
          step() {
            local name="$1"; shift
            if ! out=$("$@" 2>&1); then
              printf '%s\n' "$out" | tail -25 > /tmp/err.txt
              echo "::error title=bump step failed: ${name}::$(tr '\n' ' ' < /tmp/err.txt | cut -c1-3500)"
              exit 1
            fi
            printf '%s\n' "$out" | tail -5
          }
          go version
          # x/net < v0.60.0 and x/text < v0.39.0 carry GO-2026-6617, -6612, -6611,
          # -6610, -6603 (fixed x/net 0.60.0), -5026, -4918; GO-2026-5970 (x/text).
          step "go get" go get golang.org/x/net@v0.61.0 golang.org/x/text@v0.40.0
          step "go mod tidy" go mod tidy
          step "go mod verify" go mod verify
          step "go build" go build ./...
          step "go vet" go vet ./...
          git rm -q .github/workflows/tmp-bump-deps.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add go.mod go.sum
          echo "::notice title=go.mod diff::$(git diff --cached go.mod | grep -E '^[-+]\s' | tr '\n' ' ' | cut -c1-2000)"
          step "git commit" git commit -m "deps: golang.org/x/net v0.61.0, golang.org/x/text v0.40.0

          Same fixes as firestack (paulvers-ui2/firestack fix/xnet-vulns):
          GO-2026-6617, GO-2026-6612, GO-2026-6611, GO-2026-6610, GO-2026-6603,
          GO-2026-5026, GO-2026-4918 (x/net http2) and GO-2026-5970 (x/text).
          Computed on the runner by the self-deleting tmp-bump-deps workflow."
          step "git push" git push origin HEAD:security/pipeline
