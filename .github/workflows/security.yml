name: 🛡️ Security (gosec, govulncheck, CodeQL, gitleaks)

# Same pipeline as paulvers-ui2/firestack go-security.yml (NIST SSDF PW.7,
# PW.8, RV.1). usque carries WARP traffic for AuroraVPN, so a reachable
# known vulnerability fails the build.
on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: '17 5 * * 1' # weekly: new CVEs and CodeQL queries find old code
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: security-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-race:
    name: Tests (race detector)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version: '>=1.26' # newest patched Go: stdlib security fixes ship in point releases          check-latest: true
      - run: go test -race -count=1 ./...

  govulncheck:
    name: govulncheck (blocking on reachable vulnerabilities)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version: '>=1.26' # newest patched Go: stdlib security fixes ship in point releases          check-latest: true
      - name: Run govulncheck
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@v1.9.0
          "$(go env GOPATH)/bin/govulncheck" ./...
      - name: govulncheck SARIF -> Security tab
        if: always()
        run: |
          "$(go env GOPATH)/bin/govulncheck" -format sarif ./... > govulncheck.sarif || true
      - if: always()
        # govulncheck can emit duplicate stack entries that code scanning
        # rejects as invalid SARIF; the blocking check is the step above.
        continue-on-error: true
        uses: github/codeql-action/upload-sarif@24c54180a607b1449ed407dd24f251e4e9147c8d # v4.38.3
        with:
          sarif_file: govulncheck.sarif
          category: govulncheck

  gosec:
    name: gosec (SAST)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version: '>=1.26' # newest patched Go: stdlib security fixes ship in point releases          check-latest: true
      - name: Run gosec (report to Security tab)
        run: |
          go install github.com/securego/gosec/v2/cmd/gosec@v2.30.0
          "$(go env GOPATH)/bin/gosec" -no-fail -fmt sarif -out gosec.sarif ./...
      - uses: github/codeql-action/upload-sarif@24c54180a607b1449ed407dd24f251e4e9147c8d # v4.38.3
        with:
          sarif_file: gosec.sarif
          category: gosec

  codeql:
    name: CodeQL (go)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      security-events: write
      actions: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version: '>=1.26' # newest patched Go: stdlib security fixes ship in point releases          check-latest: true
      - uses: github/codeql-action/init@24c54180a607b1449ed407dd24f251e4e9147c8d # v4.38.3
        with:
          languages: go
          build-mode: autobuild
          queries: security-extended
      - uses: github/codeql-action/analyze@24c54180a607b1449ed407dd24f251e4e9147c8d # v4.38.3
        with:
          category: /language:go

  gitleaks:
    name: Secret scan (gitleaks, full history)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version: '1.26'
          cache: false
      - run: go install github.com/zricethezav/gitleaks/v8@v8.30.1
      - run: '"$(go env GOPATH)/bin/gitleaks" git --redact --no-banner .'
